name: Apply active-turn checkpoint compaction

on:
  push:
    branches:
      - fix/active-turn-checkpoint-compaction

permissions:
  contents: write

concurrency:
  group: active-turn-checkpoint-compaction
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Apply root-cause fix
        shell: bash
        run: |
          set -euo pipefail
          expected=8117c0d527ad58bf04ce326ee7a4716d2f1b6c51
          actual="$(git hash-object internal/agent/compact_projection.go)"
          if [[ "$actual" != "$expected" ]]; then
            echo "compact_projection.go base blob mismatch: $actual != $expected" >&2
            exit 1
          fi
          python3 tools/apply_active_turn_compaction.py
          gofmt -w \
            internal/agent/compact_projection.go \
            internal/agent/compact_active_turn.go \
            internal/agent/compact_active_turn_test.go
          git diff --check

      - name: Run focused regression tests
        run: >-
          go test ./internal/agent
          -run 'Test(PlanCompactionFold|CompletedActiveTurnPrefixEnd|ActiveTurnCheckpoint)'
          -count=1

      - name: Run agent test suite
        run: go test ./internal/agent -count=1

      - name: Run repository test suite
        run: go test ./... -count=1

      - name: Run static checks
        shell: bash
        run: |
          set -euo pipefail
          go vet ./internal/agent
          go run ./tools/repolint

      - name: Commit verified fix
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-active-turn-compaction.yml
          git rm tools/apply_active_turn_compaction.py
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(context): checkpoint completed work inside active turns"
          git push origin "HEAD:${GITHUB_REF_NAME}"
