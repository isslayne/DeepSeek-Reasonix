name: Apply active-turn checkpoint compaction

on:
  push:
    branches:
      - fix/active-turn-checkpoint-compaction

permissions:
  contents: write

concurrency:
  group: active-turn-checkpoint-compaction
  cancel-in-progress: true

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Apply final root-cause implementation
        shell: bash
        run: |
          set -euo pipefail
          expected=8117c0d527ad58bf04ce326ee7a4716d2f1b6c51
          actual="$(git hash-object internal/agent/compact_projection.go)"
          if [[ "$actual" != "$expected" ]]; then
            echo "compact_projection.go base blob mismatch: $actual != $expected" >&2
            exit 1
          fi
          python3 tools/apply_active_turn_compaction.py
          python3 tools/update_active_turn_compaction_contract.py
          python3 tools/update_active_turn_force_boundary.py
          python3 tools/update_active_turn_summary_request.py
          gofmt -w \
            internal/agent/compact.go \
            internal/agent/compact_projection.go \
            internal/agent/compact_active_turn.go \
            internal/agent/compact_active_turn_test.go \
            internal/agent/cachehit_e2e_test.go \
            internal/agent/context_recovery_tool_loop_test.go
          git diff --check

      - name: Diagnose learned-window admission contract
        shell: bash
        run: |
          set -euo pipefail
          grep -R -n -C 18 -E \
            'func \(a \*Agent\) applyAdmissionToRequest|outputBudgetReserve|shared-window output budget|func \(a \*Agent\) effectiveContextWindow|ObservedWindow' \
            internal/agent || true

      - name: Verify active-turn checkpoint integration
        run: |
          go test ./internal/agent -run 'Test(PlanCompactionFold|CompletedActiveTurnPrefixEnd|ActiveTurnCheckpoint|SmallWindowUsesActiveTurnCheckpoints|ToolLoopRetriesOnlyAfterOverflowMaintenanceProgress)' -count=1 -timeout=5m

      - name: Verify full agent package
        run: go test ./internal/agent -count=1 -timeout=10m

      - name: Vet agent package
        run: go vet ./internal/agent

      - name: Commit final implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-active-turn-compaction.yml
          rm -f tools/apply_active_turn_compaction.py
          rm -f tools/update_active_turn_compaction_contract.py
          rm -f tools/update_active_turn_force_boundary.py
          rm -f tools/update_active_turn_summary_request.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(context): enable rolling active-turn checkpoints"
          git push origin HEAD:${{ github.ref_name }}
