name: Apply active-turn checkpoint compaction

on:
  push:
    branches:
      - fix/active-turn-checkpoint-compaction

permissions:
  contents: write

concurrency:
  group: active-turn-checkpoint-compaction
  cancel-in-progress: true

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Apply root-cause fix and debug instrumentation
        shell: bash
        run: |
          set -euo pipefail
          expected=8117c0d527ad58bf04ce326ee7a4716d2f1b6c51
          actual="$(git hash-object internal/agent/compact_projection.go)"
          if [[ "$actual" != "$expected" ]]; then
            echo "compact_projection.go base blob mismatch: $actual != $expected" >&2
            exit 1
          fi
          python3 tools/apply_active_turn_compaction.py
          python3 tools/update_active_turn_compaction_contract.py
          python3 tools/debug_active_turn_overflow.py
          gofmt -w \
            internal/agent/compact_projection.go \
            internal/agent/compact_active_turn.go \
            internal/agent/compact_active_turn_test.go \
            internal/agent/cachehit_e2e_test.go \
            internal/agent/context_recovery_tool_loop_test.go
          git diff --check

      - name: Diagnose overflow checkpoint progression
        run: >-
          go test ./internal/agent
          -run '^TestToolLoopRetriesOnlyAfterOverflowMaintenanceProgress$'
          -count=1
          -timeout=2m
          -v
