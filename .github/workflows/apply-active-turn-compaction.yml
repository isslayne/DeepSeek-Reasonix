name: Apply active-turn checkpoint compaction

on:
  push:
    branches:
      - fix/active-turn-checkpoint-compaction

permissions:
  contents: write

concurrency:
  group: active-turn-checkpoint-compaction
  cancel-in-progress: true

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Apply root-cause fix
        shell: bash
        run: |
          set -euo pipefail
          expected=8117c0d527ad58bf04ce326ee7a4716d2f1b6c51
          actual="$(git hash-object internal/agent/compact_projection.go)"
          if [[ "$actual" != "$expected" ]]; then
            echo "compact_projection.go base blob mismatch: $actual != $expected" >&2
            exit 1
          fi
          python3 tools/apply_active_turn_compaction.py
          python3 tools/update_active_turn_compaction_contract.py
          python3 - <<'PY'
          from pathlib import Path

          active = Path("internal/agent/compact_active_turn.go")
          text = active.read_text()
          old = "\tfoldEnd := completedActiveTurnFoldEnd(msgs, foldStart, plannedEnd)\n"
          new = """\tfoldEnd := completedActiveTurnFoldEnd(msgs, foldStart, plannedEnd)
\tif force {
\t\t// Physical-overflow recovery must maximize reclaimed context. Once a
\t\t// tool-call/result group is complete it is safe to checkpoint; retaining
\t\t// the newest complete group can itself consume the learned provider
\t\t// window and make the retry impossible. Normal pressure compaction still
\t\t// keeps that newest group verbatim for cache/protocol locality.
\t\tfoldEnd = completedActiveTurnPrefixEnd(msgs, foldStart, plannedEnd)
\t}
"""
          if text.count(old) != 1:
              raise SystemExit(f"active-turn force boundary: expected 1 match, got {text.count(old)}")
          active.write_text(text.replace(old, new, 1))

          tests = Path("internal/agent/compact_active_turn_test.go")
          text = tests.read_text()
          start = text.index("func TestPlanCompactionFoldRetainsNewestToolGroup")
          end = text.index("func TestPlanCompactionFoldRejectsSingleIrreducibleToolGroup", start)
          region = text[start:end]
          old_call = "plan, ok := a.planCompactionFold(msgs, true)"
          if region.count(old_call) != 1:
              raise SystemExit(f"retain-newest contract: expected 1 match, got {region.count(old_call)}")
          region = region.replace(old_call, "plan, ok := a.planCompactionFold(msgs, false)", 1)
          text = text[:start] + region + text[end:]
          tests.write_text(text)
          PY
          gofmt -w \
            internal/agent/compact_projection.go \
            internal/agent/compact_active_turn.go \
            internal/agent/compact_active_turn_test.go \
            internal/agent/cachehit_e2e_test.go \
            internal/agent/context_recovery_tool_loop_test.go
          git diff --check

      - name: Verify active-turn checkpoint integration
        run: |
          go test ./internal/agent -run 'Test(PlanCompactionFold|CompletedActiveTurnPrefixEnd|ActiveTurnCheckpoint|SmallWindowUsesActiveTurnCheckpoints|ToolLoopRetriesOnlyAfterOverflowMaintenanceProgress)' -count=1 -timeout=5m

      - name: Verify full agent package
        run: go test ./internal/agent -count=1 -timeout=10m

      - name: Vet agent package
        run: go vet ./internal/agent

      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-active-turn-compaction.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/agent/compact_projection.go \
                  internal/agent/compact_active_turn.go \
                  internal/agent/compact_active_turn_test.go \
                  internal/agent/cachehit_e2e_test.go \
                  internal/agent/context_recovery_tool_loop_test.go \
                  .github/workflows/apply-active-turn-compaction.yml
          git commit -m "fix(context): enable rolling active-turn checkpoints"
          git push origin HEAD:${{ github.ref_name }}
